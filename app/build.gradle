plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.safenavi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.safenavi.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Inject keys into BuildConfig
        buildConfigField "String", "NOMINATIM_BASE_URL", "\"${localProperties.getProperty('NOMINATIM_BASE_URL', 'https://nominatim.openstreetmap.org')}\""
        buildConfigField "String", "VALHALLA_BASE_URL", "\"${localProperties.getProperty('VALHALLA_BASE_URL', 'https://valhalla1.openstreetmap.de')}\""
        buildConfigField "String", "RISK_API_BASE_URL", "\"${localProperties.getProperty('RISK_API_BASE_URL', 'http://10.0.2.2:8000')}\""
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
            excludes += ['META-INF/LICENSE']
            excludes += ['META-INF/LICENSE.txt']
            excludes += ['META-INF/license.txt']
            excludes += ['META-INF/NOTICE']
            excludes += ['META-INF/NOTICE.txt']
            excludes += ['META-INF/notice.txt']
            excludes += ['META-INF/ASL2.0']
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.material:material:1.11.0'

    // OpenStreetMap rendering through MapLibre.
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Circle ImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // HTTP client for the authenticated Safe-Navi API and open map services.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20210307'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
